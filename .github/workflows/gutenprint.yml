name: Gutenprint (driver build + G2010 probe)

on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/gutenprint.yml"
  workflow_dispatch:

jobs:
  gutenprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Gutenprint source
        run: native/fetch-gutenprint.sh

      - name: Build for the CI machine (for the probe)
        run: native/build-host.sh

      - name: Probe Canon G2010 options
        run: /tmp/gp-host/probe | tee /tmp/probe.txt

      - name: Test every option combination the app uses
        run: |
          cc -O1 -o /tmp/gp-host/printtest native/probe/printtest.c -I/tmp/gp-host/include /tmp/gp-host/lib/libgutenprint.a -lm
          /tmp/gp-host/printtest 2>/tmp/printtest-err.txt | tee /tmp/printtest.txt
          echo "--- driver messages:"; sort /tmp/printtest-err.txt | uniq -c | head -40
          mkdir -p /tmp/g2010-test-pages && /tmp/gp-host/printtest /tmp/g2010-test-pages && ls -la /tmp/g2010-test-pages

      - uses: actions/upload-artifact@v4
        with:
          name: g2010-test-pages
          path: /tmp/g2010-test-pages/*.prn

      - name: Cross-compile for Android arm64
        run: native/build-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: gutenprint-probe
          path: |
            /tmp/probe.txt
            /tmp/printtest.txt
