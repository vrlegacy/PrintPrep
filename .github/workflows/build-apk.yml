name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Pick NDK
        run: |
          echo "NDK_DIR=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK_VER=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"

      - name: Cache Canon driver (Gutenprint) build
        id: gpcache
        uses: actions/cache@v4
        with:
          path: native/prebuilt
          key: gutenprint-${{ env.NDK_VER }}-${{ hashFiles('native/*.sh', 'native/configure-flags.txt') }}

      - name: Build Canon driver (Gutenprint) for Android
        if: steps.gpcache.outputs.cache-hit != 'true'
        run: |
          native/fetch-gutenprint.sh
          native/build-host.sh
          ANDROID_NDK_LATEST_HOME="$NDK_DIR" native/build-android.sh

      - name: Bundle printer data
        run: |
          mkdir -p app/src/main/assets/gutenprint
          rm -rf app/src/main/assets/gutenprint/xml
          cp -r native/prebuilt/arm64-v8a/data/xml app/src/main/assets/gutenprint/xml

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Load signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_PASSWORD" ]; then
            # Check the key really opens with the password before using it; otherwise build with a temporary key.
            if echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/printprep.jks" 2>/dev/null \
               && keytool -list -keystore "$RUNNER_TEMP/printprep.jks" -storepass "$KEY_PASSWORD" -alias printprep >/dev/null 2>&1; then
              echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/printprep.jks" >> "$GITHUB_ENV"
              echo "Signing with the PrintPrep key from secrets"
            else
              rm -f "$RUNNER_TEMP/printprep.jks"
              echo "::warning::The signing secrets don't form a valid key (wrong key text or password). Building with a temporary key instead."
            fi
          else
            echo "::warning::No signing secrets set: this APK uses a temporary key and won't install over earlier builds."
          fi

      - name: Build debug APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleDebug --stacktrace -PndkVer="$NDK_VER"

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "PrintPrep-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PrintPrep-debug-apk
          path: PrintPrep-${{ github.run_number }}.apk

      # A plain .apk (not a zip) on the Releases page, easy to download straight on the phone.
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PrintPrep build ${{ github.run_number }}
          body: "Commit ${{ github.sha }}: ${{ github.event.head_commit.message }}"
          files: PrintPrep-${{ github.run_number }}.apk
          make_latest: true
